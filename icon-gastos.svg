<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- House body -->
  <rect x="136" y="240" width="240" height="190" rx="14" fill="white"/>

  <!-- Roof -->
  <polygon points="108,258 256,118 404,258" fill="rgba(255,255,255,0.92)"/>

  <!-- Door -->
  <rect x="216" y="330" width="80" height="100" rx="10" fill="#059669"/>
  <!-- Door knob -->
  <circle cx="284" cy="382" r="7" fill="rgba(255,255,255,0.7)"/>

  <!-- Window left -->
  <rect x="148" y="272" width="70" height="60" rx="8" fill="#6ee7b7" opacity="0.7"/>
  <!-- Window right -->
  <rect x="294" y="272" width="70" height="60" rx="8" fill="#6ee7b7" opacity="0.7"/>

  <!-- Dollar sign coin top-right -->
  <circle cx="380" cy="110" r="58" fill="rgba(255,255,255,0.95)"/>
  <text x="380" y="130" text-anchor="middle" font-size="68" font-family="Arial,sans-serif" font-weight="900" fill="#059669">$</text>
</svg>
