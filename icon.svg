<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Road surface -->
  <path d="M0 420 L512 420 L512 512 L0 512Z" fill="url(#road)"/>
  <!-- Road dashes -->
  <rect x="72"  y="450" width="72" height="14" rx="7" fill="rgba(255,255,255,0.35)"/>
  <rect x="220" y="450" width="72" height="14" rx="7" fill="rgba(255,255,255,0.35)"/>
  <rect x="368" y="450" width="72" height="14" rx="7" fill="rgba(255,255,255,0.35)"/>

  <!-- Car body (lower) -->
  <rect x="96" y="278" width="320" height="118" rx="22" fill="white"/>
  <!-- Car cabin (upper) -->
  <rect x="156" y="192" width="200" height="106" rx="24" fill="rgba(255,255,255,0.9)"/>
  <!-- Windshield / windows -->
  <rect x="174" y="206" width="76" height="68" rx="12" fill="#0891b2" opacity="0.55"/>
  <rect x="262" y="206" width="76" height="68" rx="12" fill="#0891b2" opacity="0.55"/>
  <!-- Window divider -->
  <rect x="250" y="206" width="12" height="68" fill="rgba(255,255,255,0.7)"/>

  <!-- Headlights -->
  <rect x="96"  y="298" width="30" height="22" rx="11" fill="#f59e0b" opacity="0.9"/>
  <!-- Taillights -->
  <rect x="386" y="298" width="30" height="22" rx="11" fill="#dc2626" opacity="0.75"/>

  <!-- Door line -->
  <rect x="252" y="282" width="6" height="108" fill="rgba(8,100,160,0.15)"/>

  <!-- Wheels -->
  <circle cx="188" cy="400" r="52" fill="#0c4a6e" stroke="white" stroke-width="9"/>
  <circle cx="188" cy="400" r="24" fill="rgba(255,255,255,0.55)"/>
  <circle cx="188" cy="400" r="9"  fill="#0c4a6e"/>
  <circle cx="324" cy="400" r="52" fill="#0c4a6e" stroke="white" stroke-width="9"/>
  <circle cx="324" cy="400" r="24" fill="rgba(255,255,255,0.55)"/>
  <circle cx="324" cy="400" r="9"  fill="#0c4a6e"/>

  <!-- Location pin top-right -->
  <circle cx="400" cy="104" r="56" fill="rgba(255,255,255,0.95)"/>
  <circle cx="400" cy="92"  r="30" fill="#0891b2"/>
  <circle cx="400" cy="92"  r="13" fill="white"/>
  <path d="M400 122 L382 148 Q400 158 418 148 Z" fill="rgba(255,255,255,0.95)"/>

  <!-- Small plane top-left  -->
  <g opacity="0.65" transform="translate(72,78) rotate(-30)">
    <ellipse cx="0" cy="0" rx="38" ry="12" fill="white"/>
    <ellipse cx="-8" cy="-18" rx="20" ry="7" fill="white"/>
    <ellipse cx="30" cy="6" rx="14" ry="5" fill="white"/>
    <rect x="-48" y="-4" width="20" height="8" rx="4" fill="white"/>
  </g>
</svg>
